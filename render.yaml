services:
  - type: web
    name: sptinder-api
    region: ohio
    plan: free
    env: node
    rootDir: apps/api
    buildCommand: npm install && npm run build
    startCommand: node dist/index.js
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: SPOTIFY_CLIENT_ID
        value: 08bb68f750b84bee90a3327e147d8dca
      - key: SPOTIFY_CLIENT_SECRET
        value: 8aae39d92fa4475dbf1126dd6147c7a5
      - key: JWT_SECRET
        value: Wz3xQ9KmNp2RvT8YhB4fLdJ6sA1cE5gI
      - key: ENCRYPTION_KEY
        value: 3hLjWqZ6tvMLXGTNaCeyKEXFk27yoNyM
      - key: REDIRECT_URI
        value: https://sptinder-api.onrender.com/api/auth/callback
      # Add DATABASE_URL after creating PostgreSQL database
      # - key: DATABASE_URL
      #   value: <paste-connection-string-here>

# Deploy Static Site separately:
# 1. "New +" → "Static Site"
# 2. Name: sptinder-web
# 3. Root Directory: apps/web  
# 4. Build Command: npm install && npm run build
# 5. Publish Directory: dist