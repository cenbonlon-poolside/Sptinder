services:
  - type: web
    name: sptinder-api
    region: ohio
    plan: free
    env: node
    rootDir: apps/api
    buildCommand: npm install && npm run build
    startCommand: node dist/index.js
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: REDIRECT_URI
        value: https://sptinder-api.onrender.com/auth/callback

# Static site needs to be deployed separately as Render doesn't support it in blueprints yet
# Deploy via "New Static Site" manually