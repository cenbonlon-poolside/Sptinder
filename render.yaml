services:
  - type: postgresql
    name: sptinder-db
    region: ohio
    plan: free

  - type: web
    name: sptinder-api
    region: ohio
    plan: free
    env: node
    rootDir: apps/api
    buildCommand: npm install && npm run build
    startCommand: node dist/index.js
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromService:
          name: sptinder-db
          property: connectionString
      - key: SPOTIFY_CLIENT_ID
        value: 08bb68f750b84bee90a3327e147d8dca
      - key: SPOTIFY_CLIENT_SECRET
        value: 8aae39d92fa4475dbf1126dd6147c7a5
      - key: JWT_SECRET
        value: Wz3xQ9KmNp2RvT8YhB4fLdJ6sA1cE5gI
      - key: ENCRYPTION_KEY
        value: 3hLjWqZ6tvMLXGTNaCeyKEXFk27yoNyM
      - key: REDIRECT_URI
        value: https://sptinder-api.onrender.com/api/auth/callback
      - key: FRONTEND_URL
        value: https://sptinder-web.onrender.com

  - type: static
    name: sptinder-web
    region: ohio
    plan: free
    rootDir: apps/web
    buildCommand: npm install && npm run build
    publishDir: dist